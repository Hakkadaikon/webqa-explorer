<!doctype html>
<html lang="ja">
<title>loading</title>
<!-- The veil comes at the click, stays still for 700 ms (longer than the
     rest the adapter waits for) and goes. -->
<button onclick="
  const veil = document.createElement('div');
  veil.setAttribute('role', 'dialog');
  veil.setAttribute('aria-modal', 'true');
  veil.setAttribute('aria-busy', 'true');
  veil.setAttribute('aria-label', '読み込み中');
  veil.style.cssText = 'position:fixed;inset:0;background:#000';
  document.body.append(veil);
  setTimeout(() => veil.remove(), 700);">検索</button>
<button>ログイン</button>
</html>
