<!doctype html>
<html lang="ja">
<title>hidden veil</title>
<!-- Busy dialogs that are not shown (display, visibility, opacity) stay in the page. The click rewrites
     the text at 800 ms, after the rest and before the page timeout (1 s). -->
<div role="dialog" aria-busy="true" aria-label="読み込み中" style="display:none"></div>
<div role="dialog" aria-busy="true" aria-label="読み込み中" style="visibility:hidden"></div>
<div role="dialog" aria-busy="true" aria-label="読み込み中" style="opacity:0"></div>
<button onclick="
  const out = document.querySelector('#out');
  setTimeout(() => { out.textContent = '結果'; }, 800);">検索</button>
<button id="out">待機</button>
</html>
