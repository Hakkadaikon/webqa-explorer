[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only; extend when a dependency needs another.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# playwright-rs の依存が持つライセンス。crate を限って許す(issue #9)
exceptions = [
  { allow = [
    "MPL-2.0",
  ], crate = "option-ext" },
  { allow = [
    "CDLA-Permissive-2.0",
  ], crate = "webpki-roots" },
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
