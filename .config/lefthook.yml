# Gates before each commit (installed by `just setup`). Mutation and dependency audits run in CI.
pre-commit:
  parallel: true
  jobs:
    - name: fmt
      run: just fmt-check
    - name: clippy
      run: just clippy
    - name: metrics
      run: just metrics
    - name: docs
      run: just docs-check
    - name: config
      run: just config-check
    - name: test
      run: just test
