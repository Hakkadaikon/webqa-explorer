# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
# Tools missing from the standard aqua registry. Their releases ship no
# checksum file; aqua-checksums.json (next to aqua.yaml) pins them instead.
packages:
  - type: github_release
    repo_owner: sourcefrog
    repo_name: cargo-mutants
    description: Mutation testing for Rust
    asset: cargo-mutants-{{.Arch}}-{{.OS}}.tar.gz
    files:
      - name: cargo-mutants
    replacements:
      amd64: x86_64
      linux: unknown-linux-gnu
      darwin: apple-darwin
    rosetta2: true
    supported_envs:
      - linux/amd64
      - darwin
  - type: github_release
    repo_owner: mozilla
    repo_name: rust-code-analysis
    description: Source code metrics (cyclomatic, cognitive, Halstead, MI)
    # Only a Linux x86_64 CLI is released; elsewhere run
    # `cargo install rust-code-analysis-cli --version 0.0.25`.
    asset: rust-code-analysis-linux-cli-x86_64.tar.gz
    files:
      - name: rust-code-analysis-cli
    supported_envs:
      - linux/amd64
  - name: crates.io/ra-jit
    type: cargo
    crate: ra-jit
    description: Rust compiler daemon on rust-analyzer for fast incremental builds
    # Built from crates.io: its GitHub release has only a moving `nightly`
    # tag and no binary for Intel macOS.
    files:
      - name: ra-jit
      - name: cargo-ra-jit
      - name: ra-jit-rustc
      - name: ra-jit-rustc-first
    cargo:
      locked: true
