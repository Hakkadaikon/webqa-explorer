# Complexity limits (also checked from rust-code-analysis by scripts/metrics.py).
cognitive-complexity-threshold = 6
too-many-arguments-threshold = 7
excessive-nesting-threshold = 3
too-many-lines-threshold = 50

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# ratatui 0.30 の依存の下で2版が入り、依存の側では消せないため(2026-10-18 に利用者が承認)
allowed-duplicate-crates = [
  "base64",
  "bitflags",
  "getrandom",
  "nix",
  "r-efi",
  "syn",
  "thiserror",
  "thiserror-impl",
  # playwright-rs 0.20 の依存の下で2版が入り、依存の側では消せないため(2026-10-18 に利用者が承認)
  "windows-sys",
  # playwright-rs → tokio-tungstenite → tungstenite → rand 0.10 の下で2版が入り、依存の側では消せないため(2026-10-18 に利用者が承認)
  "rand_core",
  # 古い版は ratatui の側、新しい版は playwright-rs → tungstenite の側から入り、依存の側では消せないため(2026-10-18 に利用者が承認)
  "block-buffer",
  "cpufeatures",
  "crypto-common",
  "digest",
  "rand",
]

# Time is read only through an injected clock, so tests never wait on the
# wall clock.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "read time through the injected clock" },
  { path = "std::time::SystemTime::now", reason = "read time through the injected clock" },
  { path = "std::thread::sleep", reason = "wait through the injected clock" },
  { path = "tokio::time::Instant::now", reason = "read time through the injected clock" },
  { path = "tokio::time::sleep", reason = "wait through the injected clock" },
  { path = "tokio::time::sleep_until", reason = "wait through the injected clock" },
  { path = "tokio::time::timeout", reason = "time out through the injected clock" },
  { path = "jiff::Timestamp::now", reason = "read time through the injected clock" },
  { path = "jiff::Zoned::now", reason = "read time through the injected clock" },
]
