[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
webqa-browser = { path = "crates/webqa-browser", version = "0.1.0" }
webqa-core = { path = "crates/webqa-core", version = "0.1.0" }
webqa-judge = { path = "crates/webqa-judge", version = "0.1.0" }
webqa-tui = { path = "crates/webqa-tui", version = "0.1.0" }
# External crates, checked on crates.io (docs/architecture.md). A crate
# adds `<name>.workspace = true` when it first uses one.
base64 = "0.23.1"
clap = "4.6.7"
crossterm = "0.29.0"
cucumber = "0.23.0"
insta = "1.49.0"
jiff = "0.2.38"
playwright-rs = "0.20.1"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tears = "0.11.1"
thiserror = "2.0.21"
tokio = "1.53.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups: everything but `restriction` is on; CI turns warnings into errors.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Picked from `restriction`.
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
dbg_macro = "warn"
excessive_nesting = "warn"
exit = "warn"
expect_used = "warn"
indexing_slicing = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
str_to_string = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
