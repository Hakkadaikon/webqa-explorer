# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/policy.json
# Allows the standard registry and this repository's local registry
# (aqua-registry.yaml). `just setup` registers it with `aqua policy allow`.
registries:
  - type: standard
    ref: semver(">= 4.0.0")
  - name: local
    type: local
    path: aqua-registry.yaml
packages:
  - registry: standard
  - registry: local
